name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip3 install --user --upgrade buildozer cython==0.29.36

      - name: Generate Precise Buildozer Profile
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = My 2D Game
          package.name = androidgameproject
          package.domain = org.testgame
          source.dir = .
          source.include_exts = py,png
          version = 0.1
          requirements = python3,kivy==2.3.1
          orientation = landscape
          osx.kivy_version = 2.3.1
          fullscreen = 1
          android.archs = arm64-v8a
          android.allow_backup = True
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Run Buildozer Pipeline
        run: |
          # Use the local user path to execute compilation
          ~/.local/bin/buildozer -v android debug

      - name: Upload APK Package
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
