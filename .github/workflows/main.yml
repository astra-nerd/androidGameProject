name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip3 install --user --upgrade buildozer cython==0.29.36

      - name: Run Buildozer Compilation Pipeline
        run: |
          ~/.local/bin/buildozer -v android debug

      - name: Export Output APK Package
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
