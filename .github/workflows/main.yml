name: Build Kivy APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Native Android Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libltdl-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Compile Application to APK
        run: |
          # Explicitly run buildozer from the local pip path
          python3 -m buildozer -v android debug

      - name: Export Output Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
